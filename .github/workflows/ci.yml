name: CI

on:
  pull_request:
    branches:
      - dev
      - prod
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux optional bindings
        run: npm install @rolldown/binding-linux-x64-gnu --no-save

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run --passWithNoTests

      - name: Build application
        run: npm run build
